# See PHASE6_DOCKER_PLAN.md for the full rationale, especially the
# "Central design decision: networking mode" section.
#
# network_mode: host is the supported default -- it's the only mode under
# which lan/lanScanner.js's ping+arp sweep sees your *real* LAN, the same
# way it does when this app runs natively. That means:
#   - Linux only. Docker Desktop for Mac/Windows runs containers inside a
#     VM, so even "host" mode there means the VM's network, not your
#     Mac/Windows machine's real LAN -- this app's own platform support
#     was already "macOS or Linux" natively, never Windows, so this isn't
#     a new restriction so much as the same one carried into Docker.
#   - No `ports:` mapping is needed or used below: under host networking
#     the container binds PORT directly on the host, exactly like
#     `npm start` does today.
#
# Want full portability instead (macOS/Windows Docker Desktop included)
# at the cost of LAN Device Monitoring reporting zero devices? Comment out
# `network_mode: host` below and uncomment the `ports:` block instead.
# Everything else (system monitoring, alerting/notifications) is
# unaffected either way.
services:
  snd-home:
    build: .
    container_name: snd-home
    network_mode: host
    # ports:
    #   - "3000:3000"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  # Optional Cloudflare Tunnel sidecar. See PHASE6_CLOUDFLARE_TUNNEL_PLAN.md
  # for the full setup steps and the security note below in more detail.
  #
  # Off by default -- `docker compose up` alone never starts this, only
  # `docker compose --profile tunnel up` does (the `profiles:` line below).
  # network_mode: host mirrors snd-home's own default, so cloudflared reaches
  # the app at http://localhost:$PORT the same way a plain `curl` from the
  # host already does -- no container-to-container networking to configure.
  # depends_on's service_healthy reuses the Dockerfile's existing
  # HEALTHCHECK (GET /api/health) so cloudflared doesn't route traffic
  # before the app is actually up.
  #
  # SECURITY: a tunnel only gets traffic to this origin -- it does not add
  # authentication. Set CLOUDFLARE_TUNNEL_TOKEN in .env (see .env.example),
  # and put Cloudflare Access (Zero Trust > Access > Applications) in front
  # of the tunnel hostname if you want real authentication before exposing
  # this beyond your LAN -- API_KEY alone still only gates mutating
  # alert/notifier endpoints and all of /api/lan, per README's Auth section.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: snd-home-tunnel
    network_mode: host
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      snd-home:
        condition: service_healthy
